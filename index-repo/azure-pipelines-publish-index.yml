# Publishes this repo's plugin index (plugins/*.yaml manifests) as a
# versioned Universal Package to the shared Azure Artifacts feed, so the
# dongle host CLI can download+cache it instead of git-cloning this repo
# (see dongle's internal/index and its README's "Index access" section).
#
# This file belongs in the INDEX repo, NOT the dongle host repo — it has no
# Go source of its own. It complements azure-pipelines-validate.yml
# (already staged alongside this file): that one gates PRs before merge,
# this one runs after a merge lands on main and turns the result into
# something dongle can consume.
#
# ALL of the actual logic — computing the next monotonic version, tagging
# and pushing it, archiving plugins/ into index.tar.gz, and publishing it —
# lives in scripts/publish-index.sh, which this pipeline just calls. That
# script is also what a maintainer runs by hand (today, while this
# pipeline isn't wired up / triggerable yet — see its own header comment).
# Calling the exact same script here means a manual publish and a pipeline
# publish always produce byte-identical archives under the exact same
# versioning logic, by construction — there is nothing to keep in sync by
# hand. If you ever need to change the versioning or archiving logic,
# change it in scripts/publish-index.sh, not here.
#
# TODO: fill in ORGANIZATION, PROJECT, and FEED below before running this
# pipeline for real -- PACKAGE_NAME defaults to "dongle-index", distinct
# from any per-plugin package name published to the same feed. These MUST
# match scripts/publish-index.sh's own defaults/TODOs, since that script
# is what actually reads them (as env vars — Azure Pipelines exposes every
# pipeline variable to script steps as an identically named env var, no
# extra plumbing needed here).
#
# TODO: the build service identity behind System.AccessToken (used for
# both the tag push and the `az artifacts universal publish` call inside
# scripts/publish-index.sh) needs:
#   - Contribute access on this repo (Project Settings -> Repositories ->
#     this repo -> Security), to push the new git tag.
#   - Feed Contributor rights on FEED (Artifacts -> that feed -> Feed
#     Settings -> Permissions), to publish the package.
# Neither is granted by default — both TODOs must be done once, by hand,
# before this pipeline's first real run.

trigger:
  branches:
    include:
      - main

pr: none # this pipeline runs on merge/push to main only, never on a PR itself

pool:
  vmImage: ubuntu-latest

variables:
  # TODO: set these to your real Azure DevOps org/project + shared feed
  # before running this pipeline. This should be the SAME shared feed
  # per-plugin binaries are published to (see docs/publishing-plugins.md)
  # — dongle-index is just one more package in it, distinguished by name.
  # Must match scripts/publish-index.sh's own TODO defaults — see the note
  # at the top of this file.
  ORGANIZATION: "TODO-azure-devops-org" # e.g. "acme" (used as https://dev.azure.com/<ORGANIZATION>)
  PROJECT: "TODO-azure-devops-project" # leave empty ("") for an org-scoped feed
  FEED: "TODO-shared-feed-name"
  PACKAGE_NAME: "dongle-index" # must match the package name dongle's build/runtime config points at

steps:
  - checkout: self
    persistCredentials: true # needed to `git push` the new tag (scripts/publish-index.sh)
    fetchDepth: 0 # need full tag history to find the highest existing 0.0.* tag

  - script: ./scripts/publish-index.sh
    displayName: "Publish $(PACKAGE_NAME) (scripts/publish-index.sh)"
    env:
      # Auth for `az artifacts universal publish`, read directly by
      # scripts/publish-index.sh (no `az login` / service connection
      # needed) — the pipeline job's own build-identity OAuth token.
      # Requires Feed Contributor on FEED — see the TODO block at the top
      # of this file. ORGANIZATION/PROJECT/FEED/PACKAGE_NAME above are
      # already exposed to this step as identically named env vars by
      # Azure Pipelines, with no extra mapping needed.
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
