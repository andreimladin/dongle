# Smoke test of the dongle LINUX distribution: the release-shaped
# ("batteries-included", -tags embed) dongle-linux-amd64 and
# dongle-linux-arm64 binaries actually start, run their first-run bootstrap,
# and answer `dongle --version` and `dongle --help` with exit 0 and the
# expected output. This is not a unit-test gate — azure-pipelines-ci.yml
# already builds/vets/tests the module on every PR; this pipeline exercises
# the shipped executables themselves.
#
# Where the binaries come from (the `source` parameter):
#   build — compile them from the checked-out commit with the SAME script
#           the release uses (scripts/build.sh fetch_embedded + build_binary;
#           see azure-pipelines-release.yml), under a throwaway
#           0.0.0-smoketest.<BuildId> version. Tests "what the next release
#           of this branch would ship". Default.
#   feed  — download the already-published dongle-linux-<arch> Universal
#           Package (what azure-pipelines-release.yml publishes) from the
#           host feed, at `version` ("*" = latest). Tests "what users get".
# Either way the binary lands at dist/dongle-linux-<arch>, so the smoke
# steps don't care which source was used.
#
# Architecture coverage (one matrix leg each, both on Microsoft-hosted
# ubuntu-latest, which is amd64-only):
#   linux/amd64 — run NATIVELY on the agent.
#   linux/arm64 — run under QEMU USER-MODE EMULATION: binfmt_misc is
#                 registered for arm64 via tonistiigi/binfmt, then the arm64
#                 binary runs inside an arm64 container
#                 (`docker run --platform linux/arm64`).
#
# NOTE: linux/arm64 is tested via QEMU emulation, NOT on a native arm64
# agent. That proves the binary is a valid, runnable arm64 executable and
# the smoke commands pass, but it can't catch issues that only show up on
# real arm64 hardware/kernels (CPU-feature detection, kernel/syscall
# differences, emulator-masked bugs). If faithful native arm64 testing is
# later required, swap the arm64 leg to a self-hosted arm64 agent pool
# (`pool: { name: <your-arm64-pool> }`) with `runner: native` and drop the
# QEMU setup step.
#
# Trigger: manual by default (Run pipeline → pick source/version). Both
# sources need the Azure service connection (release builds always embed,
# so even `build` must pull the embedded defaults + index from the feed),
# which is why this isn't wired to PRs out of the box. To run it on
# PRs/pushes once the TODOs below are filled in and the service connection
# is authorized for this pipeline, replace `trigger: none` / `pr: none`
# with e.g.:
#
#   trigger:
#     branches: { include: [main, release/*] }
#   pr:
#     branches: { include: [main] }
trigger: none
pr: none

parameters:
  - name: source
    displayName: "Where to get the linux binaries"
    type: string
    default: build
    values:
      - build
      - feed
  - name: version
    displayName: "Feed package version (source=feed only; * = latest)"
    type: string
    default: "*"

pool:
  vmImage: ubuntu-latest

variables:
  # TODO: set to your real host feed and service connection (same values as
  # azure-pipelines-release.yml). AZURE_SERVICE_CONNECTION needs read access
  # to HOST_FEED (source=feed) and to the plugin/index feed named in
  # configs/build.yaml (source=build).
  HOST_FEED: "TODO-host-feed-name"
  AZURE_SERVICE_CONNECTION: "TODO-azure-service-connection-name"
  # TODO: pin both images by digest for reproducibility if desired.
  BINFMT_IMAGE: "tonistiigi/binfmt:latest"
  ARM64_RUN_IMAGE: "debian:bookworm-slim"
  # Version baked into source=build binaries; asserted in `dongle --version`.
  ${{ if eq(parameters.source, 'build') }}:
    EXPECTED_VERSION: "0.0.0-smoketest.$(Build.BuildId)"
  ${{ elseif ne(parameters.version, '*') }}:
    EXPECTED_VERSION: "${{ parameters.version }}"
  ${{ else }}:
    EXPECTED_VERSION: "any" # latest from the feed: only assert it looks like x.y.z

jobs:
  - job: SmokeTest
    displayName: "Smoke test"
    strategy:
      matrix:
        linux_amd64_native:
          arch: amd64
          runner: native # runs directly on the amd64 hosted agent
        linux_arm64_qemu:
          arch: arm64
          runner: qemu # emulated on the amd64 hosted agent — see NOTE above
    steps:
      - checkout: self

      # ---- obtain dist/dongle-linux-$(arch) ---------------------------------

      - ${{ if eq(parameters.source, 'build') }}:
          - task: GoTool@0
            inputs:
              version: "1.21" # TODO: keep in sync with azure-pipelines-release.yml
            displayName: "Install Go"

          # Cross-compiling from the amd64 agent is fine for both legs:
          # build.sh's output is a static Go binary for the target arch.
          - task: AzureCLI@2
            inputs:
              azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -eu
                az extension add --name azure-devops --only-show-errors
                ./scripts/build.sh fetch_embedded linux $(arch)
            displayName: "build.sh fetch_embedded linux $(arch)"

          - script: ./scripts/build.sh build_binary linux $(arch)
            env:
              DONGLE_VERSION: $(EXPECTED_VERSION)
            displayName: "build.sh build_binary linux $(arch)"

      - ${{ if eq(parameters.source, 'feed') }}:
          - task: AzureCLI@2
            inputs:
              azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -eu
                az extension add --name azure-devops --only-show-errors
                dl=$(mktemp -d)
                # TODO: add `--project <project> --scope project` if HOST_FEED
                # is project-scoped (mirrors azure-pipelines-release.yml,
                # which publishes org-scoped).
                az artifacts universal download \
                  --organization "$(System.CollectionUri)" \
                  --feed "$(HOST_FEED)" \
                  --name "dongle-linux-$(arch)" \
                  --version "${{ parameters.version }}" \
                  --path "$dl"
                mkdir -p dist
                cp "$dl/dongle-linux-$(arch)" "dist/dongle-linux-$(arch)"
                chmod 0755 "dist/dongle-linux-$(arch)"
            displayName: "Download dongle-linux-$(arch)@${{ parameters.version }} from the host feed"

      # ---- QEMU (arm64 leg only) -------------------------------------------

      - script: |
          set -eu
          docker run --privileged --rm "$(BINFMT_IMAGE)" --install arm64
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64
          docker run --rm --platform linux/arm64 "$(ARM64_RUN_IMAGE)" uname -m | grep -qx aarch64
          echo "arm64 emulation ready"
        condition: and(succeeded(), eq(variables.runner, 'qemu'))
        displayName: "Set up QEMU/binfmt for linux/arm64 emulation"

      # ---- smoke test ------------------------------------------------------

      - script: |
          set -uo pipefail
          bin="$PWD/dist/dongle-linux-$(arch)"
          [ -f "$bin" ] || { echo "##vso[task.logissue type=error]missing $bin"; exit 1; }

          # Guard against testing the wrong arch: an amd64 binary would
          # "pass" inside the arm64 container too (the amd64 kernel just
          # runs it natively).
          want=$([ "$(arch)" = arm64 ] && echo 'ARM aarch64' || echo 'x86-64')
          info=$(file "$bin"); echo "$info"
          case "$info" in *"$want"*) ;; *) echo "##vso[task.logissue type=error]$bin is not a $want binary"; exit 1 ;; esac

          # dongle runs with a fresh, throwaway data/home dir on every call,
          # so each one is a real first run (embedded index + default
          # plugins unpacked) and the agent's own home is never touched.
          dongle() {
            if [ "$(runner)" = qemu ]; then
              docker run --rm --platform linux/arm64 \
                -v "$bin:/usr/local/bin/dongle:ro" \
                -e HOME=/tmp/h -e DONGLE_DATA_DIR=/tmp/h/data -e XDG_CACHE_HOME=/tmp/h/cache \
                "$(ARM64_RUN_IMAGE)" dongle "$@"
            else
              local h; h=$(mktemp -d)
              HOME="$h" DONGLE_DATA_DIR="$h/data" XDG_CACHE_HOME="$h/cache" "$bin" "$@"
            fi
          }

          failed=0
          fail() { echo "##vso[task.logissue type=error]$*"; failed=1; }

          # run <name> <args...>: run dongle, show its output, check exit 0
          # and that it printed no error:/warning: diagnostics.
          out=$(mktemp) err=$(mktemp)
          run() {
            local name=$1; shift
            echo "===== dongle $* ====="
            dongle "$@" >"$out" 2>"$err"
            local rc=$?
            echo "--- stdout ---"; cat "$out"
            echo "--- stderr ---"; cat "$err"
            echo "--- exit $rc ---"
            [ "$rc" -eq 0 ] || fail "$name: exit code $rc, want 0"
            ! grep -Eq 'error:|warning:' "$err" || fail "$name: diagnostics on stderr"
          }
          expect() { grep -Eq -e "$2" "$out" || fail "$1: stdout does not match /$2/"; }

          run "--version" --version
          if [ "$(EXPECTED_VERSION)" != any ]; then
            expect "--version" "^dongle[[:space:]]+$(EXPECTED_VERSION)\$"
          else
            expect "--version" '^dongle[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+'
          fi
          # Release builds always embed: on a first run the index comes from
          # the embedded seed and the embedded default plugins get installed.
          expect "--version" '^index[[:space:]]+.+\(embedded\)'
          expect "--version" '^installed plugins:'

          run "--help" --help
          expect "--help" 'one CLI, plug in the rest'
          expect "--help" '^Usage:'
          expect "--help" 'dongle <plugin> \[args\.\.\.\]'
          expect "--help" '--version'

          [ "$failed" -eq 0 ] || exit 1
          echo "smoke test passed: linux/$(arch) ($(runner))"
        displayName: "Smoke test dongle-linux-$(arch) ($(runner))"

      - publish: dist/dongle-linux-$(arch)
        artifact: dongle-linux-$(arch)-tested
        condition: succeededOrFailed()
        displayName: "Publish tested binary (for debugging)"
