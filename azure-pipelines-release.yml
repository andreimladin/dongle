# Manual-only release pipeline: builds all six "batteries-included" host
# binaries — one per job in a matrix, via scripts/build.sh's fetch_embedded
# and build_binary — and publishes each as its own Universal Package to the
# host feed. Never triggered by a push or a PR — `trigger: none` / `pr:
# none` below mean this only runs when queued by hand (or via the REST
# API), and only makes sense run against a release/X.Y.Z branch (the Guard
# job below enforces that and derives DONGLE_VERSION from the branch name).
#
# All actual build logic lives in scripts/build.sh — this pipeline only
# orchestrates (checkout, az login, run the script, publish its output), so
# a future migration to GitHub Actions is a thin wrapper rewrite, not a
# rewrite of the build itself. Target platforms live only in this matrix,
# not duplicated into repo config. Release always embeds — there is no
# no-embed release path.
#
# After every BuildAndPublish leg succeeds, TestLinux smoke-tests the two
# linux packages exactly as published (downloaded back from the host feed
# at DONGLE_VERSION): linux/amd64 natively, linux/arm64 under QEMU
# emulation (see the NOTE on that job).
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  # TODO: set these to your real Azure Artifacts feed names and service
  # connection before running this pipeline. AZURE_SERVICE_CONNECTION must
  # have access to BOTH feeds: PLUGIN_FEED (to download the embedded
  # defaults listed in configs/build.yaml) and HOST_FEED (to publish the six built
  # host binaries).
  PLUGIN_FEED: "TODO-plugin-feed-name"
  HOST_FEED: "TODO-host-feed-name"
  AZURE_SERVICE_CONNECTION: "TODO-azure-service-connection-name"
  # TODO: pin both images by digest for reproducibility if desired. Used
  # only by the TestLinux job's linux/arm64 (QEMU) leg.
  BINFMT_IMAGE: "tonistiigi/binfmt:latest"
  ARM64_RUN_IMAGE: "debian:bookworm-slim"

jobs:
  - job: Guard
    displayName: "Guard: verify release/X.Y.Z branch, derive DONGLE_VERSION"
    steps:
      - script: |
          set -eu
          branch="$(Build.SourceBranch)"
          if [[ ! "$branch" =~ ^refs/heads/release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: this pipeline must be run on a release/X.Y.Z branch (got $branch)" >&2
            exit 1
          fi
          version="${branch#refs/heads/release/}"
          echo "releasing version $version"
          echo "##vso[task.setvariable variable=DONGLE_VERSION;isOutput=true]$version"
        name: setver
        displayName: "Guard branch, derive version"

  - job: BuildAndPublish
    dependsOn: Guard
    displayName: "Build and publish"
    variables:
      DONGLE_VERSION: $[ dependencies.Guard.outputs['setver.DONGLE_VERSION'] ]
    strategy:
      matrix:
        darwin_arm64: { os: darwin, arch: arm64 }
        darwin_amd64: { os: darwin, arch: amd64 }
        linux_amd64: { os: linux, arch: amd64 }
        linux_arm64: { os: linux, arch: arm64 }
        windows_amd64: { os: windows, arch: amd64 }
        windows_arm64: { os: windows, arch: arm64 }
    steps:
      - checkout: self

      - task: GoTool@0
        inputs:
          version: "1.21"
        displayName: "Install Go"

      - task: AzureCLI@2
        inputs:
          azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -eu
            az extension add --name azure-devops --only-show-errors
            ./scripts/build.sh fetch_embedded $(os) $(arch)
        displayName: "build.sh fetch_embedded $(os) $(arch)"

      - script: ./scripts/build.sh build_binary $(os) $(arch)
        env:
          DONGLE_VERSION: $(DONGLE_VERSION)
        displayName: "build.sh build_binary $(os) $(arch)"

      - task: AzureCLI@2
        inputs:
          azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -eu
            az extension add --name azure-devops --only-show-errors

            bin="dist/dongle-$(os)-$(arch)"
            if [ "$(os)" = "windows" ]; then
              bin="${bin}.exe"
            fi
            if [ ! -f "$bin" ]; then
              echo "error: expected build output $bin not found" >&2
              exit 1
            fi

            stage=$(mktemp -d)
            cp "$bin" "$stage/"

            echo "publishing dongle-$(os)-$(arch)@$(DONGLE_VERSION)..."
            az artifacts universal publish \
              --organization "$(System.CollectionUri)" \
              --feed "$(HOST_FEED)" \
              --name "dongle-$(os)-$(arch)" \
              --version "$(DONGLE_VERSION)" \
              --path "$stage" \
              --description "dongle host release $(DONGLE_VERSION) ($(os)/$(arch))"

            rm -rf "$stage"
        displayName: "Publish dongle-$(os)-$(arch) to the host feed"

  # Smoke test of the just-published LINUX distribution: each binary must
  # start, run its first-run bootstrap, and answer `dongle --version` and
  # `dongle --help` with exit 0 and the expected output.
  #
  # NOTE: linux/arm64 is tested via QEMU emulation, NOT on a native arm64
  # agent — Microsoft-hosted agents are amd64-only, so binfmt_misc is
  # registered for arm64 (tonistiigi/binfmt) and the arm64 binary runs in an
  # arm64 container (`docker run --platform linux/arm64`). That proves it's
  # a valid, runnable arm64 executable, but can't catch issues that only
  # show up on real arm64 hardware/kernels. If faithful native arm64 testing
  # is later required, swap the arm64 leg to a self-hosted arm64 agent pool
  # (job-level `pool: { name: <your-arm64-pool> }` for that leg) with
  # `runner: native` and drop the QEMU setup step.
  - job: TestLinux
    dependsOn:
      - Guard
      - BuildAndPublish
    displayName: "Smoke test published linux binaries"
    variables:
      DONGLE_VERSION: $[ dependencies.Guard.outputs['setver.DONGLE_VERSION'] ]
    strategy:
      matrix:
        linux_amd64_native:
          arch: amd64
          runner: native # runs directly on the amd64 hosted agent
        linux_arm64_qemu:
          arch: arm64
          runner: qemu # emulated on the amd64 hosted agent — see NOTE above
    steps:
      - checkout: none

      - task: AzureCLI@2
        inputs:
          azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -eu
            az extension add --name azure-devops --only-show-errors
            dl=$(mktemp -d)
            az artifacts universal download \
              --organization "$(System.CollectionUri)" \
              --feed "$(HOST_FEED)" \
              --name "dongle-linux-$(arch)" \
              --version "$(DONGLE_VERSION)" \
              --path "$dl"
            mkdir -p dist
            cp "$dl/dongle-linux-$(arch)" "dist/dongle-linux-$(arch)"
            chmod 0755 "dist/dongle-linux-$(arch)"
        displayName: "Download dongle-linux-$(arch)@$(DONGLE_VERSION) from the host feed"

      # ---- QEMU (arm64 leg only) -------------------------------------------

      - script: |
          set -eu
          docker run --privileged --rm "$(BINFMT_IMAGE)" --install arm64
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64
          docker run --rm --platform linux/arm64 "$(ARM64_RUN_IMAGE)" uname -m | grep -qx aarch64
          echo "arm64 emulation ready"
        condition: and(succeeded(), eq(variables.runner, 'qemu'))
        displayName: "Set up QEMU/binfmt for linux/arm64 emulation"

      # ---- smoke test ------------------------------------------------------

      - script: |
          set -uo pipefail
          bin="$PWD/dist/dongle-linux-$(arch)"
          [ -f "$bin" ] || { echo "##vso[task.logissue type=error]missing $bin"; exit 1; }

          # Guard against testing the wrong arch: an amd64 binary would
          # "pass" inside the arm64 container too (the amd64 kernel just
          # runs it natively).
          want=$([ "$(arch)" = arm64 ] && echo 'ARM aarch64' || echo 'x86-64')
          info=$(file "$bin"); echo "$info"
          case "$info" in *"$want"*) ;; *) echo "##vso[task.logissue type=error]$bin is not a $want binary"; exit 1 ;; esac

          # dongle runs with a fresh, throwaway data/home dir on every call,
          # so each one is a real first run (embedded index + default
          # plugins unpacked) and the agent's own home is never touched.
          dongle() {
            if [ "$(runner)" = qemu ]; then
              docker run --rm --platform linux/arm64 \
                -v "$bin:/usr/local/bin/dongle:ro" \
                -e HOME=/tmp/h -e DONGLE_DATA_DIR=/tmp/h/data -e XDG_CACHE_HOME=/tmp/h/cache \
                "$(ARM64_RUN_IMAGE)" dongle "$@"
            else
              local h; h=$(mktemp -d)
              HOME="$h" DONGLE_DATA_DIR="$h/data" XDG_CACHE_HOME="$h/cache" "$bin" "$@"
            fi
          }

          failed=0
          fail() { echo "##vso[task.logissue type=error]$*"; failed=1; }

          # run <name> <args...>: run dongle, show its output, check exit 0
          # and that it printed no error:/warning: diagnostics.
          out=$(mktemp) err=$(mktemp)
          run() {
            local name=$1; shift
            echo "===== dongle $* ====="
            dongle "$@" >"$out" 2>"$err"
            local rc=$?
            echo "--- stdout ---"; cat "$out"
            echo "--- stderr ---"; cat "$err"
            echo "--- exit $rc ---"
            [ "$rc" -eq 0 ] || fail "$name: exit code $rc, want 0"
            ! grep -Eq 'error:|warning:' "$err" || fail "$name: diagnostics on stderr"
          }
          expect() { grep -Eq -e "$2" "$out" || fail "$1: stdout does not match /$2/"; }

          run "--version" --version
          expect "--version" "^dongle[[:space:]]+$(DONGLE_VERSION)\$"
          # Release builds always embed: on a first run the index comes from
          # the embedded seed and the embedded default plugins get installed.
          expect "--version" '^index[[:space:]]+.+\(embedded\)'
          expect "--version" '^installed plugins:'

          run "--help" --help
          expect "--help" 'one CLI, plug in the rest'
          expect "--help" '^Usage:'
          expect "--help" 'dongle <plugin> \[args\.\.\.\]'
          expect "--help" '--version'

          [ "$failed" -eq 0 ] || exit 1
          echo "smoke test passed: linux/$(arch) ($(runner))"
        displayName: "Smoke test dongle-linux-$(arch) ($(runner))"

      - publish: dist/dongle-linux-$(arch)
        artifact: dongle-linux-$(arch)-tested
        condition: succeededOrFailed()
        displayName: "Publish tested binary (for debugging)"
